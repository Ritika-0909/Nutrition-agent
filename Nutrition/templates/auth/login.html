{% extends "base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card animate-fadein">
    <div class="auth-header text-center mb-4">
      <div class="auth-logo"><i class="bi bi-heart-pulse-fill"></i></div>
      <h2 class="fw-bold mt-3">Welcome back</h2>
      <p class="text-muted">Sign in to your NutriAgent account</p>
    </div>
    <form method="POST" action="{{ url_for('auth.login') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}"/>
      <div class="mb-3">
        <label class="form-label fw-medium">Email or Username</label>
        <div class="input-group input-group-modern">
          <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
          <input type="text" name="identifier" class="form-control" placeholder="Enter email or username" required autofocus />
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-medium d-flex justify-content-between">
          Password <a href="#" class="text-primary small">Forgot?</a>
        </label>
        <div class="input-group input-group-modern">
          <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
          <input type="password" name="password" id="loginPassword" class="form-control" placeholder="Enter password" required />
          <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('loginPassword')">
            <i class="bi bi-eye-fill"></i>
          </button>
        </div>
      </div>
      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" name="remember" id="rememberMe">
        <label class="form-check-label" for="rememberMe">Remember me for 30 days</label>
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-lg">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>
    <p class="text-center mt-4 text-muted">
      Don't have an account? <a href="{{ url_for('auth.register') }}" class="text-primary fw-medium">Create one free</a>
    </p>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>
function togglePassword(id) {
  const el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}
</script>
{% endblock %}
