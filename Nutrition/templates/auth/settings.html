{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:640px">
  <div class="page-header mb-4">
    <h2><i class="bi bi-gear-fill text-primary me-2"></i>Account Settings</h2>
  </div>
  <!-- Change Password -->
  <div class="card card-modern mb-4">
    <div class="card-body p-4">
      <h5 class="card-title"><i class="bi bi-shield-lock-fill me-2 text-success"></i>Change Password</h5>
      <form method="POST">
        <input type="hidden" name="action" value="change_password" />
        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}"/>
        <div class="mb-3">
          <label class="form-label">Current Password</label>
          <input type="password" name="old_password" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <input type="password" name="new_password" class="form-control" required minlength="8" />
        </div>
        <div class="mb-3">
          <label class="form-label">Confirm New Password</label>
          <input type="password" name="confirm_password" class="form-control" required />
        </div>
        <button type="submit" class="btn btn-success">Update Password</button>
      </form>
    </div>
  </div>
  <!-- Delete Account -->
  <div class="card card-modern border-danger-subtle">
    <div class="card-body p-4">
      <h5 class="card-title text-danger"><i class="bi bi-exclamation-triangle-fill me-2"></i>Delete Account</h5>
      <p class="text-muted small">This action is irreversible. All your data will be permanently deleted.</p>
      <form method="POST" onsubmit="return confirm('Are you sure? This cannot be undone!')">
        <input type="hidden" name="action" value="delete_account" />
        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}"/>
        <div class="mb-3">
          <label class="form-label">Type <strong>DELETE</strong> to confirm</label>
          <input type="text" name="confirm_text" class="form-control border-danger" pattern="DELETE" required />
        </div>
        <button type="submit" class="btn btn-danger">Delete My Account</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
