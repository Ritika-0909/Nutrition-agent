{% extends "base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="auth-card animate-fadein" style="max-width:520px">
    <div class="auth-header text-center mb-4">
      <div class="auth-logo"><i class="bi bi-heart-pulse-fill"></i></div>
      <h2 class="fw-bold mt-3">Create your account</h2>
      <p class="text-muted">Start your personalized nutrition journey today</p>
    </div>
    <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}"/>
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label fw-medium">Full Name</label>
          <div class="input-group input-group-modern">
            <span class="input-group-text"><i class="bi bi-person-fill"></i></span>
            <input type="text" name="full_name" class="form-control" placeholder="Your full name"
                   value="{{ form_data.get('full_name','') if form_data else '' }}" />
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-medium">Username <span class="text-danger">*</span></label>
          <div class="input-group input-group-modern">
            <span class="input-group-text"><i class="bi bi-at"></i></span>
            <input type="text" name="username" class="form-control" placeholder="username" required
                   value="{{ form_data.get('username','') if form_data else '' }}" />
          </div>
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-medium">Email Address <span class="text-danger">*</span></label>
        <div class="input-group input-group-modern">
          <span class="input-group-text"><i class="bi bi-envelope-fill"></i></span>
          <input type="email" name="email" class="form-control" placeholder="you@example.com" required
                 value="{{ form_data.get('email','') if form_data else '' }}" />
        </div>
      </div>
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="form-label fw-medium">Password <span class="text-danger">*</span></label>
          <div class="input-group input-group-modern">
            <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
            <input type="password" name="password" id="regPassword" class="form-control" placeholder="Min. 8 chars" required />
            <button type="button" class="btn btn-outline-secondary" onclick="togglePassword('regPassword')">
              <i class="bi bi-eye-fill"></i>
            </button>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label fw-medium">Confirm Password <span class="text-danger">*</span></label>
          <div class="input-group input-group-modern">
            <span class="input-group-text"><i class="bi bi-lock-check-fill"></i></span>
            <input type="password" name="confirm_password" id="regConfirm" class="form-control" placeholder="Repeat password" required />
          </div>
        </div>
      </div>
      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" required id="agreeTerms">
        <label class="form-check-label" for="agreeTerms">
          I agree to the <a href="#" class="text-primary">Terms of Service</a> and
          <a href="#" class="text-primary">Privacy Policy</a>
        </label>
      </div>
      <button type="submit" class="btn btn-primary w-100 btn-lg">
        <i class="bi bi-rocket-takeoff-fill me-2"></i>Create Account — Free
      </button>
    </form>
    <p class="text-center mt-4 text-muted">
      Already have an account? <a href="{{ url_for('auth.login') }}" class="text-primary fw-medium">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
{% block extra_js %}
<script>function togglePassword(id) { const el=document.getElementById(id); el.type=el.type==='password'?'text':'password'; }</script>
{% endblock %}
