{% extends "base.html" %}
{% block title %}{{ 'Edit Member' if member else 'Add Family Member' }}{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:640px">
  <div class="page-header mb-4">
    <h2><i class="bi bi-person-plus-fill text-purple me-2"></i>{{ 'Edit' if member else 'Add' }} Family Member</h2>
  </div>
  <div class="card card-modern">
    <div class="card-body p-4">
      <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() if csrf_token is defined else '' }}"/>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" required value="{{ member.name if member else '' }}" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Relation</label>
            <select name="relation" class="form-select">
              {% for r in ['Spouse','Son','Daughter','Father','Mother','Sibling','Grandparent','Other'] %}
              <option {{ 'selected' if member and member.relation == r }}>{{ r }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Age</label>
            <input type="number" name="age" class="form-control" value="{{ member.age if member else '' }}" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Gender</label>
            <select name="gender" class="form-select">
              {% for g in ['Male','Female','Other'] %}
              <option {{ 'selected' if member and member.gender == g }}>{{ g }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Weight (kg)</label>
            <input type="number" step="0.1" name="weight_kg" class="form-control" value="{{ member.weight_kg if member else '' }}" />
          </div>
          <div class="col-md-3">
            <label class="form-label">Height (cm)</label>
            <input type="number" step="0.1" name="height_cm" class="form-control" value="{{ member.height_cm if member else '' }}" />
          </div>
          <div class="col-md-6">
            <label class="form-label">Dietary Preference</label>
            <select name="dietary_preference" class="form-select">
              {% for v in ['omnivore','vegetarian','vegan','eggetarian','jain','gluten_free'] %}
              <option value="{{ v }}" {{ 'selected' if member and member.dietary_preference == v }}>{{ v|title }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Fitness Goal</label>
            <select name="fitness_goal" class="form-select">
              {% for v, l in [('weight_loss','Weight Loss'),('muscle_gain','Muscle Gain'),('maintenance','Maintenance'),('diabetes_management','Diabetes'),('heart_health','Heart Health')] %}
              <option value="{{ v }}" {{ 'selected' if member and member.fitness_goal == v }}>{{ l }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Allergies</label>
            <input type="text" name="allergies" class="form-control" value="{{ member.allergies if member else '' }}" placeholder="e.g. nuts, dairy, gluten" />
          </div>
          <div class="col-12">
            <label class="form-label">Medical Conditions</label>
            <input type="text" name="medical_conditions" class="form-control" value="{{ member.medical_conditions if member else '' }}" placeholder="e.g. diabetes, hypertension" />
          </div>
          <div class="col-12">
            <label class="form-label">Notes</label>
            <textarea name="notes" class="form-control" rows="2">{{ member.notes if member else '' }}</textarea>
          </div>
        </div>
        <div class="mt-4 d-flex gap-2">
          <button type="submit" class="btn btn-primary px-4">
            <i class="bi bi-check-circle-fill me-2"></i>{{ 'Update' if member else 'Add Member' }}
          </button>
          <a href="{{ url_for('family.family_list') }}" class="btn btn-outline-secondary">Cancel</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
