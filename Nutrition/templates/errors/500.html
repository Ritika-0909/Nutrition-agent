{% extends "base.html" %}
{% block title %}500 — Server Error{% endblock %}
{% block content %}
<div class="container text-center py-5 mt-5">
  <div class="error-code">500</div>
  <h3 class="mb-3">Internal Server Error</h3>
  <p class="text-muted mb-4">Something went wrong on our end. Please try again shortly.</p>
  <a href="{{ url_for('index') }}" class="btn btn-primary px-4"><i class="bi bi-arrow-clockwise me-2"></i>Try Again</a>
</div>
{% endblock %}
