services:
  - type: web
    name: nutriagent-ai
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: nutriagent-db
          property: connectionString
      - key: IBM_API_KEY
        sync: false
      - key: IBM_PROJECT_ID
        sync: false
      - key: IBM_WATSONX_URL
        value: https://us-south.ml.cloud.ibm.com
      - key: GRANITE_MODEL_ID
        value: ibm/granite-13b-instruct-v2
      - key: SESSION_COOKIE_SECURE
        value: "True"
      - key: BCRYPT_LOG_ROUNDS
        value: "12"
    healthCheckPath: /health

databases:
  - name: nutriagent-db
    plan: free
